<script>(function(){
// Browser capability probe (ES5-only so it runs even on old engines)
function probe(){var bad=[];

}
function show(msg){
  var d=document.getElementById('zik-err');
  if(!d){d=document.createElement('div');d.id='zik-err';d.style.cssText='position:fixed;left:8px;right:8px;top:8px;z-index:10000;background:#3a0d18;color:#ffd7de;border:1px solid #ff5c8a;border-radius:10px;padding:10px;font:12px/1.5 monospace;direction:rtl;text-align:right;max-height:45%;overflow:auto;white-space:pre-wrap';(document.body||document.documentElement).appendChild(d);}

}
